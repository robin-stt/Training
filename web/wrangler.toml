name = "dagsformen"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Behåll variabler som satts i Cloudflares kontrollpanel; annars skriver
# varje deploy över dem med innehållet i vars-sektionen längst ner.
keep_vars = true

# Frontend ligger i public/ och serveras direkt av Cloudflare.
# Allt under /api/ går till workern.
[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "dagsformen"
# Skapad i Cloudflares kontrollpanel.
database_id = "55536946-9e71-4063-9a78-bc98187be32a"

# API-nyckeln ligger i kontots Secrets Store och kopplas in här i
# konfigurationen, så att varje bygge garanterat får med den.
[[secrets_store_secrets]]
binding = "ANTHROPIC_NYCKEL"
store_id = "9db4c419cbc74aa2a99375503ed470e8"
secret_name = "ANTHROPIC_API_KEY"

[vars]
# Ungefär 200 kr. När månadens uppskattade kostnad passerar taket pausas
# coachen till nästa månad; resten av appen fortsätter fungera.
MANADSTAK_USD = "19"
# Hur många coach-svar varje användare får per månad.
SVAR_PER_ANVANDARE = "15"
